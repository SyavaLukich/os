# ASUS X550EA: Radeon HD 8330 — GCN 1.0 (Southern Islands, Kalindi)
# Драйвер amdgpu (не radeon): нужны параметры ядра si_support, см. x550ea docs.
Section "Device"
    Identifier "Radeon HD 8330"
    Driver     "amdgpu"
    Option     "AccelMethod" "glamor"
    Option     "DRI"         "3"
    Option     "TearFree"    "on"
    # Экономия батареи APU: динамическое управление питанием GPU
    Option     "DynamicPM"   "on"
EndSection

Section "Monitor"
    Identifier "LVDS"
    # Родная панель ноутбука
    Option     "PreferredMode" "1366x768"
EndSection
