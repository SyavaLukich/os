# ASUS X550EA: Radeon HD 8330 — GCN 1.0 (Southern Islands, Kalindi)
# ВАЖНО: OutputClass с MatchDriver, а не Section "Device"!
# Жёсткий Device/Driver amdgpu применялся на ЛЮБОМ железе и ломал X
# в VirtualBox/QEMU (видеокарта не AMD -> no screens found).
# OutputClass сработает только там, где ядро реально подняло amdgpu.
Section "OutputClass"
    Identifier "X550EA Radeon HD 8330"
    MatchDriver "amdgpu"
    Driver     "amdgpu"
    Option     "AccelMethod" "glamor"
    Option     "DRI"         "3"
    Option     "TearFree"    "on"
    Option     "DynamicPM"   "on"
EndSection
