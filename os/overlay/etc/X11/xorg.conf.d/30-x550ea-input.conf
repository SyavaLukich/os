# X550EA: Elan/Synaptics тачпад + клавиатура, libinput без лишних эффектов
Section "InputClass"
    Identifier "X550EA touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "false"
    Option "AccelSpeed" "0.15"
    Option "DisableWhileTyping" "on"
EndSection
